<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>


    <script src="https://unpkg.com/supersimpledev@8.6.4/dayjs.js"></script>
  

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>


    <script type="text/babel">
        function App(){
            const[count,setCount]=React.useState(0)
            React.useEffect(()=>{
                setInterval(()=>{
                    setCount(count+1);
                },1000)    
            },[]);
            function onPress(){
                setCount(
                   count+1
                )
            }
            function onReset(){
                setCount(
                    count=0
                )
            }
            return(
                <>
                    {count==0 && <button onClick={onPress}>Clicked {count} times</button>}
                    {count >=1 && <button onClick={onPress}>Clicked {count} time</button>}

                    <button onClick={onReset}>Reset</button>

                    <button ref={} onClick={onReset}>Auto Click</button>
                </>
            );
        }
        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
